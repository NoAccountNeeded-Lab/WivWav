packages:
  - 'apps/*'
  - 'e2e'
  - 'packages/*'
  # Throwaway packages for issue spikes (e.g. #852's MUI evaluation). Never
  # depended on by apps/* or packages/*; removed once the spike concludes.
  - 'spikes/*/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  # Runs `prisma generate` via its own postinstall script. Needed so
  # `pnpm deploy` (used by docker/api.Dockerfile and docker/migrate.Dockerfile
  # to build pruned production images) doesn't block on this local workspace
  # package's build script during its isolated install.
  '@wivwav/db': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - turbo@2.9.17
  - '@storybook/addon-a11y@10.5.3'
  - '@storybook/builder-vite@10.5.3'
  - '@storybook/csf-plugin@10.5.3'
  - '@storybook/react-dom-shim@10.5.3'
  - '@storybook/react-vite@10.5.3'
  - '@storybook/react@10.5.3'
  - storybook@10.5.3
