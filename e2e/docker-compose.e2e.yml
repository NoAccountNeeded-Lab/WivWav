services:
  postgres:
    ports:
      - "127.0.0.1:${WIVWAV_E2E_POSTGRES_PORT:-55432}:5432"

  valkey:
    ports:
      - "127.0.0.1:${WIVWAV_E2E_VALKEY_PORT:-56379}:6379"

  meilisearch:
    ports:
      - "127.0.0.1:${WIVWAV_E2E_MEILI_PORT:-57700}:7700"

  migrate:
    image: ${WIVWAV_E2E_MIGRATE_IMAGE:-wivwav-e2e-migrate:local}

  api:
    image: ${WIVWAV_E2E_API_IMAGE:-wivwav-e2e-api:local}
    ports:
      - "127.0.0.1:${WIVWAV_E2E_API_PORT:-53001}:3001"
    environment:
      NODE_ENV: development
      # Facet renderers fetch independently; the full browser suite exceeds
      # the production default when all cases share one isolated client IP.
      RATE_LIMIT_MAX: 1000
      CORS_ORIGIN: http://127.0.0.1:${WIVWAV_E2E_WEB_PORT:-53000},http://localhost:${WIVWAV_E2E_WEB_PORT:-53000}
      INTERNAL_API_SECRET: ${WIVWAV_E2E_INTERNAL_API_SECRET:-41ddf2d6dfad63f18a7fa42d4ddc82da47fd7ac0f9e6c55530078f7c2ca941c2}
      LOG_LEVEL: info

  web:
    image: ${WIVWAV_E2E_WEB_IMAGE:-wivwav-e2e-web:local}
    build:
      args:
        # Only takes effect on the local (non-CI) build path — CI builds
        # this image itself in the "E2E smoke" job with an equivalent
        # --build-arg and skips this compose build via WIVWAV_E2E_WEB_IMAGE.
        # Must match the NEXT_PUBLIC_API_URL override below: it's a
        # build-time value for the client bundle vs. a runtime value for
        # the server process, but both need to resolve to the same place.
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${WIVWAV_E2E_API_PORT:-53001}
    ports:
      - "127.0.0.1:${WIVWAV_E2E_WEB_PORT:-53000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${WIVWAV_E2E_API_PORT:-53001}
      API_INTERNAL_URL: http://api:3001
      INTERNAL_API_SECRET: ${WIVWAV_E2E_INTERNAL_API_SECRET:-41ddf2d6dfad63f18a7fa42d4ddc82da47fd7ac0f9e6c55530078f7c2ca941c2}
