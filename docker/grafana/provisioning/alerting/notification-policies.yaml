apiVersion: 1

policies:
  - orgId: 1
    receiver: wivwav-beta-warning-email
    group_by:
      - alertname
      - severity
      - service
      - queue
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 4h
    routes:
      - receiver: wivwav-beta-critical-email
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
      - receiver: wivwav-beta-warning-email
        object_matchers:
          - ['severity', '=', 'warning']
        group_wait: 2m
        group_interval: 15m
        repeat_interval: 6h
