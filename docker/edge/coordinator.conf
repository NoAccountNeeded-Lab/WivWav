# Private worker ingress for remote workers. Publish only on a private-network
# address (WORKER_INGRESS_BIND), never a public one. Forwards only the worker
# coordinator surface; the bearer check in the API still applies.
server_tokens off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  client_max_body_size 64m;

  location = /internal/workers/ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location /internal/scraper/ {
    proxy_pass http://api:3001;
    proxy_read_timeout 300s;
  }

  location / { return 404; }
}
