# Public edge: the only path from the internet to the API. Explicit allowlist,
# everything else 404s (not 401) so private routes are denied, not merely
# unauthenticated. Allowed: /v1/*, signed /webhooks/*, narrow client telemetry
# and /health. /internal/*, /ops/*, /diagnostics/*, /docs, /openapi.json,
# /metrics and the retired admin namespace are never forwarded. See docs/ops/deployment.md.
server_tokens off;

server {
  listen 8080;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /health { include /etc/nginx/conf.d/proxy.inc; }
  location = /telemetry/client-events { include /etc/nginx/conf.d/proxy.inc; }
  location /v1/ { include /etc/nginx/conf.d/proxy.inc; }
  location /webhooks/ { include /etc/nginx/conf.d/proxy.inc; }

  location / { return 404; }
}
