# WivWav Scraper — AI Extraction Eval
#
# Tests the StructureDetector prompt against multiple candidate models.
# Run with: pnpm eval
#
# This config file is read by the custom eval runner (evals/run-eval.ts) which
# does NOT import the promptfoo npm package at runtime. Promptfoo is not a
# required dependency. To use the promptfoo CLI directly (for the web UI or
# comparison reports), run: npx promptfoo@latest eval --config promptfoo.yaml
#
# Adding new fixtures:
#   1. Drop a <name>.html file in evals/fixtures/ — real HTML from a WAV listing page.
#   2. Drop a matching <name>.expected.json file with the verified FieldMapping[] array,
#      confidence score, and notes describing the expected selectors.
#   3. Add a new test case in the `tests` section below referencing the new fixture.
#   4. Run `pnpm eval` to verify all models pass the accuracy threshold.
#
# The eval runner (evals/run-eval.ts) computes field-level accuracy by comparing
# each model's returned selectors to the expected.json ground truth. It exits non-zero
# if any model falls below the configured ACCURACY_THRESHOLD (default 0.75).

description: "WivWav scraper StructureDetector extraction prompt evaluation"

# Candidate models to test — add or swap models here.
# promptfoo supports: openai:gpt-4o, anthropic:claude-haiku-4-5-20251001, etc.
# Ollama models require the custom provider in evals/run-eval.ts.
providers:
  - id: anthropic:claude-haiku-4-5-20251001
    config:
      apiKey: "{{env.ANTHROPIC_API_KEY}}"
      temperature: 0.1
      max_tokens: 2048
  - id: ollama:llama3.2:3b
    config:
      apiBaseUrl: "{{env.OLLAMA_BASE_URL | default: 'http://localhost:11434'}}"
      temperature: 0.1
      num_predict: 2048

# Prompt template — matches the StructureDetector system prompt + user prompt format.
# The {{htmlSample}} and {{previousMappings}} variables are injected per test case.
prompts:
  - file://evals/prompts/extraction.txt

# Accuracy threshold — the eval runner enforces this; promptfoo itself just records scores.
# A model must achieve >= 0.75 field-level accuracy across all test cases to pass.
# Adjust this value as prompt quality improves.
defaultTest:
  options:
    provider:
      temperature: 0.1

# Test cases — one per fixture file pair (html + expected.json).
# vars.htmlFile and vars.expectedFile are resolved by the custom eval runner.
tests:
  - description: "BLVD rear-entry in-floor ramp (Toyota Sienna)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-01-rear-entry.html"
      expectedFile: "evals/fixtures/blvd-01-rear-entry.expected.json"
      previousMappings: "[]"

  - description: "BLVD side-entry fold-out ramp sold listing (Honda Odyssey)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-02-side-entry-sold.html"
      expectedFile: "evals/fixtures/blvd-02-side-entry-sold.expected.json"
      previousMappings: "[]"

  - description: "BLVD fold-in ramp new conversion (Chrysler Pacifica)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-03-fold-in-ramp.html"
      expectedFile: "evals/fixtures/blvd-03-fold-in-ramp.expected.json"
      previousMappings: "[]"

  - description: "BLVD wheelchair lift van (Ford Transit)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-04-lift-equipped.html"
      expectedFile: "evals/fixtures/blvd-04-lift-equipped.expected.json"
      previousMappings: "[]"

  - description: "BLVD sale-pending in-floor ramp (Dodge Grand Caravan)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-05-pending-listing.html"
      expectedFile: "evals/fixtures/blvd-05-pending-listing.expected.json"
      previousMappings: "[]"

  - description: "BLVD new vehicle zero-mile (Toyota Sienna XSE)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-06-new-vehicle.html"
      expectedFile: "evals/fixtures/blvd-06-new-vehicle.expected.json"
      previousMappings: "[]"

  - description: "Minimal HTML no price or CSS classes (Chrysler Town and Country)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-07-minimal-html.html"
      expectedFile: "evals/fixtures/blvd-07-minimal-html.expected.json"
      previousMappings: "[]"

  - description: "Definition-list spec layout (Kia Carnival)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-08-definition-list.html"
      expectedFile: "evals/fixtures/blvd-08-definition-list.expected.json"
      previousMappings: "[]"

  - description: "MobilityWorks-style div spec layout (Toyota Sienna LE)"
    vars:
      sourceName: "mobilityworks"
      htmlFile: "evals/fixtures/blvd-09-mobilityworks-style.html"
      expectedFile: "evals/fixtures/blvd-09-mobilityworks-style.expected.json"
      previousMappings: "[]"

  - description: "Missing VIN and price call-for-price (Dodge Grand Caravan SE)"
    vars:
      sourceName: "blvd"
      htmlFile: "evals/fixtures/blvd-10-no-vin-no-price.html"
      expectedFile: "evals/fixtures/blvd-10-no-vin-no-price.expected.json"
      previousMappings: "[]"
