version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # NOTE: Dependabot's docker ecosystem only scans files literally named
  # "Dockerfile" in the given directory; it does not detect this repo's
  # `<service>.Dockerfile` naming convention (api.Dockerfile, web.Dockerfile,
  # etc.). This entry is a forward-compatible placeholder until the
  # Dockerfiles are restructured into per-service subdirectories
  # (e.g. docker/api/Dockerfile) — tracked in #690.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
