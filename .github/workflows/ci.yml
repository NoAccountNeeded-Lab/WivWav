name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: docker/api.Dockerfile
            target: runner
          - service: scraper
            file: docker/scraper.Dockerfile
            target: runner
          - service: web
            file: docker/web.Dockerfile
            target: runner
          - service: ops
            file: docker/ops.Dockerfile
            target: runner
          - service: migrate
            file: docker/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the exact final (immutable, production-shaped) image once. It is
      # loaded into the local daemon so it can be smoke-tested here and, on a
      # push to main, saved as an artifact so the `publish` job pushes the
      # identical bytes the test jobs ran against — never a respin.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.service == 'scraper' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: wivwav-ci-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke-test final scraper image
        if: matrix.service == 'scraper'
        run: |
          docker run --rm --init --ipc=host \
            --security-opt seccomp=./docker/chromium-seccomp.json \
            wivwav-ci-scraper:${{ github.sha }} \
            node smoke.mjs

      # Only needed when this run could publish. Saving/uploading every PR
      # build would burn artifact storage and time for images that are
      # discarded when the job finishes.
      - name: Save built image for the publish gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save wivwav-ci-${{ matrix.service }}:${{ github.sha }} -o /tmp/${{ matrix.service }}.tar

      - name: Upload built image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  docker-done:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: docker
    if: always()
    steps:
      - run: |
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "One or more Docker builds failed."
            exit 1
          fi

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    env:
      # Turbo remote cache — both vars must be set for remote caching to activate.
      # Create a token at https://vercel.com/account/tokens and store it as a
      # repository secret named TURBO_TOKEN. TURBO_TEAM is the Vercel team slug
      # (or your personal account slug). When these are absent the run falls back
      # to local-only caching with no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Record task start time
        id: timing
        if: always()
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build api
        run: pnpm build --filter=@wivwav/api...

      - name: Build scraper
        run: pnpm build --filter=@wivwav/scraper...

      - name: Lint
        run: pnpm lint

      - name: Report Turbo lint/typecheck duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.timing.outputs.start }} ))
          echo "Turbo lint/typecheck tasks completed in ${elapsed}s (typecheck + build + lint)"
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Remote cache: enabled (TURBO_TOKEN present)"
          else
            echo "Remote cache: disabled (TURBO_TOKEN not set — set repository secret to enable)"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wav
          POSTGRES_PASSWORD: wav
          POSTGRES_DB: wivwav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wav -d wivwav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wav:wav@localhost:5432/wivwav
      # Turbo remote cache — both vars must be set for remote caching to activate.
      # Create a token at https://vercel.com/account/tokens and store it as a
      # repository secret named TURBO_TOKEN. TURBO_TEAM is the Vercel team slug
      # (or your personal account slug). When these are absent the run falls back
      # to local-only caching with no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6

      # Ubuntu 24.04 runner images restrict unprivileged user namespaces via
      # AppArmor, which breaks Chromium's own sandbox for the real (unmocked)
      # browser launch in fixture-contract.test.ts. This is Playwright's
      # documented preferred fix (over passing chromiumSandbox: false) since
      # it doesn't weaken the sandbox PlaywrightBrowserService now enables.
      - name: Enable unprivileged user namespaces for Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium for scraper fixture contracts
        run: pnpm --filter @wivwav/scraper exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Check for schema drift
        # Migrations were just applied, so the live DB reflects accumulated migration state.
        # Diff the DB against schema.prisma — any mismatch means a migration file is missing.
        # Fix locally: pnpm db:migrate:create --name <description>
        run: |
          pnpm --filter @wivwav/db exec prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Record task start time
        id: timing
        if: always()
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test

      - name: Report Turbo test duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.timing.outputs.start }} ))
          echo "Turbo test task completed in ${elapsed}s"
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Remote cache: enabled (TURBO_TOKEN present)"
          else
            echo "Remote cache: disabled (TURBO_TOKEN not set — set repository secret to enable)"
          fi

  # Publishes the exact images the jobs above just tested — never a rebuild.
  # Gated on every test job passing, and only runs for pushes to main, so a
  # failing job (docker build, lint/typecheck, or test) publishes nothing.
  publish:
    name: Publish images (digest-pinned)
    runs-on: ubuntu-latest
    needs: [docker-done, lint-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: noaccountneeded-lab/wivwav
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built images
        uses: actions/download-artifact@v5
        with:
          pattern: docker-image-*
          path: /tmp/images

      - name: Load, tag, and push each tested image by digest
        id: push
        run: |
          set -euo pipefail
          for service in api web ops scraper migrate; do
            tar_path="/tmp/images/docker-image-${service}/${service}.tar"
            docker load -i "$tar_path"

            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${service}"
            docker tag "wivwav-ci-${service}:${{ github.sha }}" "${ref}:${{ github.sha }}"
            docker tag "wivwav-ci-${service}:${{ github.sha }}" "${ref}:latest"

            push_output=$(docker push "${ref}:${{ github.sha }}")
            echo "$push_output"
            digest=$(echo "$push_output" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
            if [ -z "$digest" ]; then
              echo "Could not determine digest for ${service}" >&2
              exit 1
            fi

            docker push "${ref}:latest" > /dev/null

            echo "${service}=${digest}" >> "$GITHUB_OUTPUT"
            echo "Published ${ref}@${digest}"
          done

      - name: Pin published digests into the production deployment definition
        env:
          API_DIGEST: ${{ steps.push.outputs.api }}
          WEB_DIGEST: ${{ steps.push.outputs.web }}
          OPS_DIGEST: ${{ steps.push.outputs.ops }}
          SCRAPER_DIGEST: ${{ steps.push.outputs.scraper }}
          MIGRATE_DIGEST: ${{ steps.push.outputs.migrate }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|wivwav/api@sha256:[0-9a-f]\{64\}|wivwav/api@${API_DIGEST}|" \
            -e "s|wivwav/web@sha256:[0-9a-f]\{64\}|wivwav/web@${WEB_DIGEST}|" \
            -e "s|wivwav/ops@sha256:[0-9a-f]\{64\}|wivwav/ops@${OPS_DIGEST}|" \
            -e "s|wivwav/scraper@sha256:[0-9a-f]\{64\}|wivwav/scraper@${SCRAPER_DIGEST}|" \
            -e "s|wivwav/migrate@sha256:[0-9a-f]\{64\}|wivwav/migrate@${MIGRATE_DIGEST}|" \
            docker-compose.prod.yml

      # Best-effort: the images are already published above regardless of
      # whether this commit lands. If branch protection rejects a direct
      # push to main, warn loudly rather than fail a job whose real job
      # (publish passing images) already succeeded — an operator can apply
      # the printed digests to docker-compose.prod.yml by hand.
      - name: Commit updated digests
        run: |
          set -euo pipefail
          if git diff --quiet -- docker-compose.prod.yml; then
            echo "docker-compose.prod.yml already pins these digests; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          # [skip ci] plus GitHub's own suppression of workflow runs triggered by
          # the GITHUB_TOKEN-authored push both prevent this commit from
          # re-triggering ci.yml, so there's no publish-loop risk.
          git commit -m "chore(deploy): pin published image digests for ${{ github.sha }} [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not push digest update to main (branch protection?). Apply this diff manually:"
            git diff HEAD~1 -- docker-compose.prod.yml
          fi
