name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: docker/api.Dockerfile
            target: builder
          - service: scraper
            file: docker/scraper.Dockerfile
            target: runner
          - service: web
            file: docker/web.Dockerfile
            target: builder
          - service: migrate
            file: docker/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.service == 'scraper' }}
          tags: wivwav-ci-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke-test final scraper image
        if: matrix.service == 'scraper'
        run: |
          docker run --rm --init --ipc=host \
            --security-opt seccomp=./docker/chromium-seccomp.json \
            wivwav-ci-scraper:${{ github.sha }} \
            node smoke.mjs

  docker-done:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: docker
    if: always()
    steps:
      - run: |
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "One or more Docker builds failed."
            exit 1
          fi

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: docker-done

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6

      # Keep host Chromium aligned with the scraper fixture-contract tests:
      # Playwright can use its normal sandbox once user namespaces are enabled.
      - name: Enable unprivileged user namespaces for Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build runnable migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: false
          load: true
          tags: wivwav-ci-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build runnable api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          target: runner
          push: false
          load: true
          tags: wivwav-ci-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build runnable web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          target: runner
          push: false
          load: true
          tags: wivwav-ci-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Install Chromium for E2E
        run: pnpm --filter @wivwav/e2e exec playwright install --with-deps chromium

      - name: Run built-container Playwright smoke suite
        run: pnpm test:e2e
        env:
          WIVWAV_E2E_COMPOSE_BUILD: "0"
          WIVWAV_E2E_MIGRATE_IMAGE: wivwav-ci-migrate:${{ github.sha }}
          WIVWAV_E2E_API_IMAGE: wivwav-ci-api:${{ github.sha }}
          WIVWAV_E2E_WEB_IMAGE: wivwav-ci-web:${{ github.sha }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    env:
      # Turbo remote cache — both vars must be set for remote caching to activate.
      # Create a token at https://vercel.com/account/tokens and store it as a
      # repository secret named TURBO_TOKEN. TURBO_TEAM is the Vercel team slug
      # (or your personal account slug). When these are absent the run falls back
      # to local-only caching with no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Record task start time
        id: timing
        if: always()
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build api
        run: pnpm build --filter=@wivwav/api...

      - name: Build scraper
        run: pnpm build --filter=@wivwav/scraper...

      - name: Lint
        run: pnpm lint

      - name: Report Turbo lint/typecheck duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.timing.outputs.start }} ))
          echo "Turbo lint/typecheck tasks completed in ${elapsed}s (typecheck + build + lint)"
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Remote cache: enabled (TURBO_TOKEN present)"
          else
            echo "Remote cache: disabled (TURBO_TOKEN not set — set repository secret to enable)"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wav
          POSTGRES_PASSWORD: wav
          POSTGRES_DB: wivwav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wav -d wivwav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wav:wav@localhost:5432/wivwav
      # Turbo remote cache — both vars must be set for remote caching to activate.
      # Create a token at https://vercel.com/account/tokens and store it as a
      # repository secret named TURBO_TOKEN. TURBO_TEAM is the Vercel team slug
      # (or your personal account slug). When these are absent the run falls back
      # to local-only caching with no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6

      # Ubuntu 24.04 runner images restrict unprivileged user namespaces via
      # AppArmor, which breaks Chromium's own sandbox for the real (unmocked)
      # browser launch in fixture-contract.test.ts. This is Playwright's
      # documented preferred fix (over passing chromiumSandbox: false) since
      # it doesn't weaken the sandbox PlaywrightBrowserService now enables.
      - name: Enable unprivileged user namespaces for Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium for scraper fixture contracts
        run: pnpm --filter @wivwav/scraper exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Check for schema drift
        # Migrations were just applied, so the live DB reflects accumulated migration state.
        # Diff the DB against schema.prisma — any mismatch means a migration file is missing.
        # Fix locally: pnpm db:migrate:create --name <description>
        run: |
          pnpm --filter @wivwav/db exec prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Record task start time
        id: timing
        if: always()
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test

      - name: Report Turbo test duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.timing.outputs.start }} ))
          echo "Turbo test task completed in ${elapsed}s"
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Remote cache: enabled (TURBO_TOKEN present)"
          else
            echo "Remote cache: disabled (TURBO_TOKEN not set — set repository secret to enable)"
          fi
