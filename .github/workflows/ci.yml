name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# PR pushes group by PR number, so a newer commit cancels the older
# in-progress run for that PR. `merge_group` and `push` runs group by
# `github.run_id` — a value unique to every run — so they can never share a
# group and therefore can never cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: docker/api/Dockerfile
            target: runner
            # 25% below the 685 MB baseline measured pre-#658, ARM64.
            max-size-mb: 514
          - service: scraper
            file: docker/scraper/Dockerfile
            target: runner
          - service: web
            file: docker/web/Dockerfile
            target: runner
          - service: ops
            file: docker/ops/Dockerfile
            target: runner
          - service: migrate
            file: docker/migrate/Dockerfile
            # 50% below the 1.52 GB baseline measured pre-#658, ARM64.
            max-size-mb: 760
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the exact final (immutable, production-shaped) image once. It is
      # loaded into the local daemon so it can be smoke-tested here and, on a
      # push to main, saved as an artifact so the `publish` job pushes the
      # identical bytes the test jobs ran against — never a respin. api and
      # migrate are always loaded so the forbidden-content and size-budget
      # checks below can run on every PR, not only on pushes to main.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.service == 'scraper' || matrix.service == 'api' || matrix.service == 'migrate' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: wivwav-ci-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke-test final scraper image
        if: matrix.service == 'scraper'
        run: |
          docker run --rm --init --ipc=host \
            --security-opt seccomp=./docker/chromium-seccomp.json \
            wivwav-ci-scraper:${{ github.sha }} \
            node smoke.mjs

      # #658: the API and migration images must ship only what production
      # needs — no local secrets, no build/test-only tooling, and within an
      # agreed size budget relative to the pre-#658 baselines above.
      - name: Inspect final image for forbidden content
        if: matrix.service == 'api' || matrix.service == 'migrate'
        run: |
          set -euo pipefail
          image="wivwav-ci-${{ matrix.service }}:${{ github.sha }}"
          cid=$(docker create "$image")
          trap 'rm -f manifest.txt image.tar; docker rm -f "$cid" >/dev/null' EXIT

          # Export the image contents to a file once and check the export's
          # own exit code — piping `docker export` straight into `grep`
          # would let `grep`'s "no match" exit(1) (masked by `|| true`) hide
          # a genuine export failure (daemon hiccup, disk pressure) as a
          # false "nothing forbidden found".
          docker export "$cid" -o image.tar
          tar -tf image.tar > manifest.txt

          echo "== Checking for .env files =="
          env_files=$(grep -E '(^|/)\.env($|\.)' manifest.txt || true)
          if [ -n "$env_files" ]; then
            echo "Forbidden .env file(s) found in $image:"
            echo "$env_files"
            exit 1
          fi

          # Only the API image must be free of build/test-only tooling — the
          # migration runner intentionally keeps @wivwav/db's devDependencies
          # so the Prisma CLI (itself a devDependency) is retained; see the
          # comment above the `deploy` stage in docker/migrate/Dockerfile.
          if [ "${{ matrix.service }}" = "api" ]; then
            echo "== Checking for build/test-only tools =="
            forbidden_tools="typescript vitest eslint prettier turbo tsx"
            found_tools=""
            for tool in $forbidden_tools; do
              if grep -qE "node_modules/${tool}/package.json$" manifest.txt; then
                found_tools="$found_tools $tool"
              fi
            done
            if [ -n "$found_tools" ]; then
              echo "Forbidden dev tool(s) found in $image:$found_tools"
              exit 1
            fi
          fi

          if [ "${{ matrix.service }}" = "migrate" ]; then
            echo "== Checking the pnpm store was not retained =="
            if grep -q '^pnpm/store' manifest.txt; then
              echo "Retained /pnpm/store found in $image"
              exit 1
            fi
          fi

          echo "== Checking the container runs as non-root =="
          uid=$(docker inspect --format '{{.Config.User}}' "$image")
          if [ -z "$uid" ] || [ "$uid" = "root" ] || [ "$uid" = "0" ]; then
            echo "Image $image does not declare a non-root user (got: '$uid')"
            exit 1
          fi

          echo "== Checking image size budget =="
          size_bytes=$(docker image inspect "$image" --format '{{.Size}}')
          size_mb=$(( size_bytes / 1000 / 1000 ))
          budget_mb=${{ matrix.max-size-mb }}
          echo "$image size: ${size_mb} MB (budget: ${budget_mb} MB)"
          if [ "$size_mb" -gt "$budget_mb" ]; then
            echo "Image $image (${size_mb} MB) exceeds its ${budget_mb} MB budget"
            exit 1
          fi

      # Only needed when this run could publish. Saving/uploading every PR
      # build would burn artifact storage and time for images that are
      # discarded when the job finishes.
      - name: Save built image for the publish gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save wivwav-ci-${{ matrix.service }}:${{ github.sha }} -o /tmp/${{ matrix.service }}.tar

      - name: Upload built image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  docker-done:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: docker
    if: always()
    steps:
      - run: |
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "One or more Docker builds failed."
            exit 1
          fi

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: docker-done

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v7

      # Keep host Chromium aligned with the scraper fixture-contract tests:
      # Playwright can use its normal sandbox once user namespaces are enabled.
      - name: Enable unprivileged user namespaces for Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build runnable migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/migrate/Dockerfile
          push: false
          load: true
          tags: wivwav-ci-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build runnable api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          target: runner
          push: false
          load: true
          tags: wivwav-ci-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build runnable web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          target: runner
          push: false
          load: true
          tags: wivwav-ci-web:${{ github.sha }}
          # NEXT_PUBLIC_API_URL is inlined into the client bundle at build
          # time, so it has to match the API port this same job's compose
          # stack maps below (WIVWAV_E2E_API_PORT default: 53001) — a
          # runtime-only override cannot fix a value already baked into the
          # served JS. See #815.
          build-args: |
            NEXT_PUBLIC_API_URL=http://127.0.0.1:53001
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build runnable scraper image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/scraper/Dockerfile
          target: runner
          push: false
          load: true
          tags: wivwav-ci-scraper:${{ github.sha }}
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper

      - name: Install Chromium for E2E
        run: pnpm --filter @wivwav/e2e exec playwright install --with-deps chromium

      - name: Run built-container Playwright smoke suite
        run: pnpm test:e2e
        env:
          WIVWAV_E2E_COMPOSE_BUILD: "0"
          WIVWAV_E2E_MIGRATE_IMAGE: wivwav-ci-migrate:${{ github.sha }}
          WIVWAV_E2E_API_IMAGE: wivwav-ci-api:${{ github.sha }}
          WIVWAV_E2E_WEB_IMAGE: wivwav-ci-web:${{ github.sha }}
          WIVWAV_E2E_SCRAPER_IMAGE: wivwav-ci-scraper:${{ github.sha }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    env:
      # Turbo remote cache — both vars must be set for remote caching to activate.
      # Create a token at https://vercel.com/account/tokens and store it as a
      # repository secret named TURBO_TOKEN. TURBO_TEAM is the Vercel team slug
      # (or your personal account slug). When these are absent the run falls back
      # to local-only caching with no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Record task start time
        id: timing
        if: always()
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build api
        run: pnpm build --filter=@wivwav/api...

      - name: Build scraper
        run: pnpm build --filter=@wivwav/scraper...

      - name: Lint
        run: pnpm lint

      - name: Report Turbo lint/typecheck duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.timing.outputs.start }} ))
          echo "Turbo lint/typecheck tasks completed in ${elapsed}s (typecheck + build + lint)"
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Remote cache: enabled (TURBO_TOKEN present)"
          else
            echo "Remote cache: disabled (TURBO_TOKEN not set — set repository secret to enable)"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wav
          POSTGRES_PASSWORD: wav
          POSTGRES_DB: wivwav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wav -d wivwav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      meilisearch:
        image: getmeili/meilisearch:v1.45.2
        env:
          MEILI_MASTER_KEY: wav_master_key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wav:wav@localhost:5432/wivwav
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: wav_master_key
      VALKEY_URL: redis://localhost:6379
      # Turbo remote cache — both vars must be set for remote caching to activate.
      # Create a token at https://vercel.com/account/tokens and store it as a
      # repository secret named TURBO_TOKEN. TURBO_TEAM is the Vercel team slug
      # (or your personal account slug). When these are absent the run falls back
      # to local-only caching with no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 runner images restrict unprivileged user namespaces via
      # AppArmor, which breaks Chromium's own sandbox for the real (unmocked)
      # browser launch in fixture-contract.test.ts. This is Playwright's
      # documented preferred fix (over passing chromiumSandbox: false) since
      # it doesn't weaken the sandbox PlaywrightBrowserService now enables.
      - name: Enable unprivileged user namespaces for Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium for scraper fixture contracts
        run: pnpm --filter @wivwav/scraper exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Check for schema drift
        # Migrations were just applied, so the live DB reflects accumulated migration state.
        # Diff the DB against schema.prisma — any mismatch means a migration file is missing.
        # Fix locally: pnpm db:migrate:create --name <description>
        run: |
          pnpm --filter @wivwav/db exec prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Record task start time
        id: timing
        if: always()
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test

      - name: Upload ui-web vitest attachments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-web-vitest-attachments
          path: packages/ui-web/.vitest-attachments
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Report Turbo test duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.timing.outputs.start }} ))
          echo "Turbo test task completed in ${elapsed}s"
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Remote cache: enabled (TURBO_TOKEN present)"
          else
            echo "Remote cache: disabled (TURBO_TOKEN not set — set repository secret to enable)"
          fi

      - name: Test (integration)
        # Runs repositories, syncListings, and cache round-trips against the
        # real postgres/meilisearch/valkey service containers above (#599).
        run: pnpm test:integration

  # Proves a PostgreSQL backup taken with docker/postgres-backup/backup.sh's
  # pg_dump flags actually restores and that the invariants in #667's
  # acceptance criteria hold: history-table row counts, a vehicle-identity
  # decision, and a decryptable encrypted config secret. See
  # docs/data/backup-restore.md. Self-test mode needs no pre-existing
  # backup — it builds its own ephemeral source database.
  restore-drill:
    name: Restore drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Full install, matching every other job — a filtered install
      # (--filter @wivwav/db...) is a narrower dependency graph than what
      # actually runs here and was never itself exercised.
      - name: Install dependencies
        run: pnpm install

      - name: Run restore drill
        run: bash scripts/restore-drill.sh

  # Publishes the exact images the jobs above just tested — never a rebuild.
  # Gated on every test job passing, and only runs for pushes to main, so a
  # failing job (docker build, lint/typecheck, test, restore drill, or E2E
  # smoke) publishes nothing. E2E is not a required merge-queue check (see
  # docs/design/merge-queue.md) but it does gate this post-merge publish step,
  # so a failing or still-running E2E smoke on main blocks image publishing
  # even though it never blocked the merge itself.
  publish:
    name: Publish images (digest-pinned)
    runs-on: ubuntu-latest
    needs: [docker-done, lint-typecheck, test, restore-drill, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: noaccountneeded-lab/wivwav
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built images
        uses: actions/download-artifact@v8
        with:
          pattern: docker-image-*
          path: /tmp/images

      - name: Load, tag, and push each tested image by digest
        id: push
        run: |
          set -euo pipefail
          for service in api web ops scraper migrate; do
            tar_path="/tmp/images/docker-image-${service}/${service}.tar"
            docker load -i "$tar_path"

            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${service}"
            docker tag "wivwav-ci-${service}:${{ github.sha }}" "${ref}:${{ github.sha }}"
            docker tag "wivwav-ci-${service}:${{ github.sha }}" "${ref}:latest"

            push_output=$(docker push "${ref}:${{ github.sha }}")
            echo "$push_output"
            digest=$(echo "$push_output" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
            if [ -z "$digest" ]; then
              echo "Could not determine digest for ${service}" >&2
              exit 1
            fi

            docker push "${ref}:latest" > /dev/null

            echo "${service}=${digest}" >> "$GITHUB_OUTPUT"
            echo "Published ${ref}@${digest}"
          done

      - name: Pin published digests into the production deployment definition
        env:
          API_DIGEST: ${{ steps.push.outputs.api }}
          WEB_DIGEST: ${{ steps.push.outputs.web }}
          OPS_DIGEST: ${{ steps.push.outputs.ops }}
          SCRAPER_DIGEST: ${{ steps.push.outputs.scraper }}
          MIGRATE_DIGEST: ${{ steps.push.outputs.migrate }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|wivwav/api@sha256:[0-9a-f]\{64\}|wivwav/api@${API_DIGEST}|" \
            -e "s|wivwav/web@sha256:[0-9a-f]\{64\}|wivwav/web@${WEB_DIGEST}|" \
            -e "s|wivwav/ops@sha256:[0-9a-f]\{64\}|wivwav/ops@${OPS_DIGEST}|" \
            -e "s|wivwav/scraper@sha256:[0-9a-f]\{64\}|wivwav/scraper@${SCRAPER_DIGEST}|" \
            -e "s|wivwav/migrate@sha256:[0-9a-f]\{64\}|wivwav/migrate@${MIGRATE_DIGEST}|" \
            docker-compose.prod.yml

      # Best-effort: the images are already published above regardless of
      # whether this commit lands. If branch protection rejects a direct
      # push to main, warn loudly rather than fail a job whose real job
      # (publish passing images) already succeeded — an operator can apply
      # the printed digests to docker-compose.prod.yml by hand.
      - name: Commit updated digests
        run: |
          set -euo pipefail
          if git diff --quiet -- docker-compose.prod.yml; then
            echo "docker-compose.prod.yml already pins these digests; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          # [skip ci] plus GitHub's own suppression of workflow runs triggered by
          # the GITHUB_TOKEN-authored push both prevent this commit from
          # re-triggering ci.yml, so there's no publish-loop risk.
          git commit -m "chore(deploy): pin published image digests for ${{ github.sha }} [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not push digest update to main (branch protection?). Apply this diff manually:"
            git diff HEAD~1 -- docker-compose.prod.yml
          fi
